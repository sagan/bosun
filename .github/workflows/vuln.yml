# Advisories land without any change in this repo, and a Go patch release only
# reaches the shipped binaries when the toolchain line in go.mod moves, so the
# scan also runs weekly. A red run here means: bump the toolchain or the module.
name: vuln
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: go version
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
