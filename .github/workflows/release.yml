name: release
on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: builds the binaries and the multi-arch
  # images exactly as a tag would, publishes nothing. For trying a change
  # to this workflow (an action upgrade) before it has to work on a tag.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/ui/pnpm-lock.yaml }
      - run: python3 scripts/i18n-check.py web/ui/src/i18n
      - run: cd web/ui && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      # A tag must clear the same gates as master: a red commit may not ship.
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...
      - name: Real private-access cores in isolated Linux namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3 openssl
          go test -c ./internal/privateintegration -o /tmp/bosun-private.test
          sudo env BOSUN_NFT_TEST=1 BOSUN_TEST_DOWNLOAD_CORES=1 /tmp/bosun-private.test -test.run '^TestPrivateAccessLinuxCores$' -test.v -test.timeout 15m
      - run: make linux VERSION="${GITHUB_REF_NAME}"
      - run: scripts/build-geocheck.sh bin
      - name: diagnostic tool schema check
        run: BOSUN_TEST_GEOCHECK="$PWD/bin/geocheck-linux-amd64" go test ./internal/netdiag -run TestInstalledGeoCheckSchema
      - name: diagnostic tool vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary bin/geocheck-linux-amd64
      # Nodes run on Alpine too, and a binary linked against the builder's
      # glibc does not start on musl at all ("no such file or directory").
      - name: binaries are static
        run: |
          for f in bin/bosun-linux-* bin/geocheck-linux-*; do
            file "$f"
            file "$f" | grep -q 'statically linked' || { echo "$f is dynamically linked"; exit 1; }
          done
      - run: cd bin && sha256sum bosun-linux-* geocheck-linux-* geocheck-LICENSE.txt > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        if: github.event_name == 'push'
        with:
          name: bosun ${{ github.ref_name }}
          files: |
            bin/bosun-linux-amd64
            bin/bosun-linux-arm64
            bin/geocheck-linux-amd64
            bin/geocheck-linux-arm64
            bin/geocheck-LICENSE.txt
            bin/SHA256SUMS

  image:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with: { username: zeptop, password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          provenance: false
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/zeptop-dev/bosun:${{ github.ref_name }}
            ghcr.io/zeptop-dev/bosun:latest
            zeptop/bosun:${{ github.ref_name }}
            zeptop/bosun:latest
