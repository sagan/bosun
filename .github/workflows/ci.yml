name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/ui/pnpm-lock.yaml }
      - run: python3 scripts/i18n-check.py web/ui/src/i18n
      - run: cd web/ui && pnpm install --frozen-lockfile && pnpm exec oxlint src && pnpm build
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: git ls-files '*.go' | xargs gofmt -l | tee /dev/stderr | test -z "$(cat)"
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - name: Isolated Linux forwarding and egress guard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nftables iproute2 util-linux python3
          go test -c ./internal/forward -o /tmp/bosun-forward.test
          go test -c ./internal/egressguard -o /tmp/bosun-egress.test
          sudo env BOSUN_NFT_TEST=1 /tmp/bosun-forward.test -test.run '^TestNFTLinuxDualStackRelay$' -test.v -test.timeout 45s
          sudo env BOSUN_NFT_TEST=1 /tmp/bosun-egress.test -test.run '^TestGuardLinuxScopedConnections$' -test.v -test.timeout 45s
